name: refresh

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Refresh corpus, alert and rebuild dashboard
        id: pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/pipeline.py 60

      # commit even when a step failed, so the run log and alert state record it
      - name: Commit changes
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          git config user.name "ohmytibo-bot"
          git config user.email "ohmytibo-bot@users.noreply.github.com"
          git add data/processed data/state site
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
