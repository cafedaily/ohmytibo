name: refresh

on:
  # GitHub runs schedules late (often by an hour or more), so a 5-minute cadence needs an
  # external trigger calling workflow_dispatch with mode=fast; these crons are the fallback
  schedule:
    - cron: "1-59/5 * * * *"  # fast: today's and yesterday's mirror pages + feed
    - cron: "17 */3 * * *"    # full: rescan the last 60 day pages
  workflow_dispatch:
    inputs:
      mode:
        description: "fast = today's and yesterday's pages + feed; full = rescan 60 days"
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick mode
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCHEDULE" = "1-59/5 * * * *" ] || [ "$MODE" = "fast" ]; then
            echo "days=1" >> "$GITHUB_OUTPUT"; echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "days=60" >> "$GITHUB_OUTPUT"; echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Refresh corpus, alert and rebuild dashboard
        id: pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/pipeline.py ${{ steps.mode.outputs.days }}

      # commit even when a step failed, so the run log and alert state record it;
      # fast runs commit only when stored data moved (see scripts/changed.py)
      - name: Commit changes
        if: always() && steps.pipeline.outcome != 'skipped'
        env:
          FULL: ${{ steps.mode.outputs.full }}
        run: |
          if [ "$FULL" != "true" ] && [ "$(python scripts/changed.py)" = "no" ]; then
            echo "fast run: no stored data changed, deploying without a commit"
            exit 0
          fi
          git config user.name "ohmytibo-bot"
          git config user.email "ohmytibo-bot@users.noreply.github.com"
          git add data/processed data/state site
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      # pushes made with GITHUB_TOKEN do not trigger the pages workflow, so deploy from here
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
