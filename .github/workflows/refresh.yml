name: refresh

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh corpus and rebuild dashboard
        run: python scripts/pipeline.py 60

      - name: Commit changes
        run: |
          git config user.name "ohmytibo-bot"
          git config user.email "ohmytibo-bot@users.noreply.github.com"
          git add data/processed site
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
